<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header class="login-card__header">
            <mat-card-title class="login-card__title">RMS FLUXO</mat-card-title>
            <mat-card-subtitle class="login-card__subtitle">Sistema de Gerenciamento</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content class="login-card__content">
            <form [formGroup]="formularioLogin" (ngSubmit)="efetuarLogin()">

                <mat-form-field appearance="outline" class="login-card__campo">
                    <mat-label>Usuário</mat-label>
                    <input matInput formControlName="usuario" placeholder="Ex: admin" autocomplete="off">
                    <mat-error *ngIf="formularioLogin.get('usuario')?.hasError('required')">
                        O campo usuário é obrigatório.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="login-card__campo">
                    <mat-label>Senha</mat-label>
                    <input matInput type="password" formControlName="senha" placeholder="••••">
                    <mat-error *ngIf="formularioLogin.get('senha')?.hasError('required')">
                        A senha é obrigatória.
                    </mat-error>
                    <mat-error *ngIf="formularioLogin.get('senha')?.hasError('minlength')">
                        A senha deve conter no mínimo 4 caracteres.
                    </mat-error>
                </mat-form-field>

                <div *ngIf="mensagemErro" class="login-card__erro-alert">
                    {{ mensagemErro }}
                </div>

                <button mat-raised-button color="primary" type="submit" class="login-card__botao" [disabled]="formularioLogin.invalid || carregando">
                    {{ carregando ? 'Autenticando...' : 'Entrar' }}
                </button>

            </form>
        </mat-card-content>
    </mat-card>
</div>
